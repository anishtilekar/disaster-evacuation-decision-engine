spring.datasource.url=jdbc:mysql://localhost:3306/evacuation_engine
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


spring.jpa.hibernate.ddl-auto=create-drop


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# --- STRIDE dispatch tuning, measured against the real Shivajinagar-Ghole Road ward ---
#
# max-platoon-size defaults to 30, which was chosen against synthetic test graphs whose edges
# carry thousands of persons/hour. Real OSM data for this ward does not: the median edge is
# 2700 persons/hour, which at delta=15s is 2700/240 = 11.25 persons/bucket, and 9 after the
# 0.85 capacity headroom. A 30-person platoon therefore cannot legally traverse ~90% of this
# ward's edge slots -- the engine correctly refuses to claim 30 people cross a residential
# street inside one 15-second window -- so most demand came back as a shortfall.
#
# 6 is set from the measured capacity histogram: it excludes only the 1200 persons/hour edges
# (4/bucket, 212 of 4021 slots, ~5%) and keeps the other 95% usable. Larger parties simply
# split into more waves and flow through over time, which is what the design intends -- "a
# large group is a flow over time, not a fiction that hundreds traverse a road simultaneously".
graph.dispatch.max-platoon-size=6

# The real ward's OSM data yields 65 shelters with 25,000+ combined seats -- so much slack that
# demand never contends for shelter space, which hides the one thing this engine is actually for.
# Capped to the 20 highest-capacity facilities, which is both closer to what a real disaster
# response would actually designate as official shelters and small enough that capacity, waves,
# and second-choice routing are all visible in a demo. See GraphEngineProperties.Osm.maxShelters.
graph.osm.max-shelters=20

# --- Seeded login accounts (Part 2) ---
#
# ddl-auto=create-drop wipes app_users on every restart, so UserSeedRunner recreates these two
# accounts on every boot. Override for anything beyond local/demo use -- these defaults are not
# meant to reach a real deployment unchanged.
app.security.seed.admin-username=admin
app.security.seed.admin-password=admin123
app.security.seed.user-username=user
app.security.seed.user-password=user123
